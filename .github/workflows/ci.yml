name: CI & SonarQube

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck · Lint · Test · SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
      # ── 1. Checkout (fetch-depth 0 dibutuhkan SonarQube untuk blame/new code)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ── 3. Install dependensi (wajib, deterministik via package-lock.json)
      - name: Install dependencies
        run: npm ci

      # ── 3b. Install dependensi backend (Express, mysql2, JWT, dll.)
      - name: Install backend dependencies
        run: npm ci --prefix server

      # ── 4. Typecheck (wajib)
      - name: TypeScript type check
        run: npm run typecheck

      # ── 5. Linter (wajib)
      - name: ESLint
        run: npm run lint

      # ── 6. Unit test + coverage (wajib; threshold 80% per metrik)
      - name: Unit test with coverage
        run: npm run test:coverage

      # ── 7. Upload laporan coverage sebagai artefak CI
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # ── 8. SonarQube Cloud scan (wajib)
      #     Butuh repository secret: SONAR_TOKEN (Settings → Secrets → Actions)
      #     Langkah ini otomatis dilewati selama token belum diatur.
      - name: SonarQube Cloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8

      - name: SonarQube token belum diatur
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN belum diatur — tambahkan repository secret agar scan SonarQube Cloud berjalan."
