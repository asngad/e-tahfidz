# ═══════════════════════════════════════════════════════════
# Konfigurasi SonarQube Cloud (sebelumnya SonarCloud)
# Dipakai oleh .github/workflows/ci.yml dan `sonar-scanner` lokal.
# Sesuaikan SONAR_ORG / PROJECT_KEY dengan proyek Anda.
# ═══════════════════════════════════════════════════════════

sonar.organization=asngad-eng
sonar.projectKey=asngad_e-tahfidz
sonar.projectName=e-tahfidz
sonar.sourceEncoding=UTF-8

# Kode produksi (frontend + backend). File uji & artefak dibuang.
sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/.features-gen/**,\
  **/.vscode/**,\
  **/*.test.*,\
  **/*.spec.*,\
  features/**,\
  steps/**,\
  migrated_prompt_history/**,\
  struktur-model-testing/**,\
  *.zip,\
  *.backup

# File uji (unit test Vitest, integration/BDD Playwright-Cucumber).
sonar.tests=.
sonar.test.inclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  features/**,\
  steps/**

# Coverage dihasilkan oleh `npm run test:coverage` (threshold >= 80%).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
