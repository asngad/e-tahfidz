# ═══════════════════════════════════════════════════════════
# Konfigurasi SonarQube Community Edition (self-hosted, lokal)
# Server : http://localhost:9000  (jalankan StartSonar.bat)
# Scan   : npm run sonar   (env SONAR_TOKEN = token hasil generate)
# ═══════════════════════════════════════════════════════════

sonar.projectKey=asngad_e-tahfidz
sonar.projectName=e-tahfidz
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Aktifkan hanya bila memakai SonarQube Cloud (bukan Community):
# sonar.organization=asngad-eng

# Kode produksi (frontend + backend). File uji & artefak dibuang.
sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/.features-gen/**,\
  **/.vscode/**,\
  **/*.test.*,\
  **/*.spec.*,\
  features/**,\
  steps/**,\
  migrated_prompt_history/**,\
  struktur-model-testing/**,\
  *.zip,\
  *.backup

# File uji (unit test Vitest, integration/BDD Playwright-Cucumber).
sonar.tests=.
sonar.test.inclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  features/**,\
  steps/**

# Coverage dihasilkan oleh `npm run test:coverage` (threshold >= 80%).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
